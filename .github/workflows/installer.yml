name: Installer bauen

# Aus der Mottulbox übernommen (project_mega/.github/workflows/installer.yml), nur Windows.
# Fertiger Installer zum Herunterladen (Actions → dieser Lauf → Artifacts): Windows .exe (NSIS,
# One-Click je Benutzer), bewusst ohne Code-Signatur (docs/INSTALL.md). Vor dem Hochladen startet
# die gepackte App einmal zur Probe (e2e/paket.mjs).
#
# Auslöser: von Hand („Run workflow“), bei einem Versions-Tag v* und in Pull Requests, die die
# Paketierung ändern – sonst sähe man einen kaputten Installer erst nach dem Merge.
# Bei einem Tag v* legt der Job „Release“ ein GitHub Release als ENTWURF an: Ab Phase 5 kommen
# Release-Beschreibung und eigene Ed25519-Signatur lokal dazu (Skill windows-paket, „Release“),
# erst dann wird es veröffentlicht.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/installer.yml'
      - 'electron-builder.yml'
      - 'build/**'
      - 'e2e/paket.mjs'
      - 'scripts/download-*.mjs'

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer · Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      # Tag und package.json müssen zusammenpassen, sonst trüge der Installer im Release eine
      # andere Versionsnummer als das Release selbst
      - name: Version zum Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in package.json"
            exit 1
          fi
      - run: npm ci
      - run: npm run electron:bin
      # Gebündelte Werkzeuge, fest gepinnt – das Skript ist der Cache-Schlüssel (wie ci.yml)
      - uses: actions/cache@v6
        with:
          path: |
            resources/exiftool
            resources/ffmpeg
          key: werkzeuge-${{ runner.os }}-${{ hashFiles('scripts/download-exiftool.mjs', 'scripts/download-ffmpeg.mjs', 'scripts/lib/laden.mjs') }}
      - run: npm run package
      - name: Gepackte App starten
        run: node e2e/run.mjs paket
      - name: Übersicht
        shell: bash
        run: |
          {
            echo "### Installer Windows"
            echo
            for f in dist/*.exe; do echo "- \`$(basename "$f")\` – $(du -h "$f" | cut -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: Galeria-Beata-Windows-${{ github.run_number }}
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release (Entwurf)
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Als einziger Job mit Schreibrecht (Release anlegen, Datei hochladen)
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Galeria-Beata-Windows-${{ github.run_number }}
          path: dist
          merge-multiple: true
      - name: Release-Entwurf anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          datei="dist/Galeria-Beata-$version-setup.exe"
          [[ -f "$datei" ]] || { echo "::error::$datei fehlt"; ls -l dist; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$datei" --clobber
          else
            gh release create "$TAG" "$datei" --draft --verify-tag \
              --title "Galeria Beata $version" --generate-notes \
              --notes "Installer für Windows – nicht signiert. Installation und Warnung beim ersten Start: [INSTALL.md](https://github.com/$GH_REPO/blob/$TAG/docs/INSTALL.md)"
          fi
          echo "### Release-Entwurf $TAG" >> "$GITHUB_STEP_SUMMARY"
